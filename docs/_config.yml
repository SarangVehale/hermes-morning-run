title: hermes-morning-run
description: Self-hosted daily-briefing pipeline — RSS-first aggregation, deterministic selection, local-LLM augmentation, Obsidian sync.
theme: jekyll-theme-cayman
show_downloads: false
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
optional_front_matter:
  remove_originals: true
readme_index:
  enabled: true
  remove_originals: false
titles_from_headings:
  enabled: true
  strip_title: true
